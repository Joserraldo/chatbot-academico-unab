<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFFBEE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1426" media="(prefers-color-scheme: dark)">
<link rel="icon" href="assets/favicon.png">
<title>Pago seguro · Asistente UNAB</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #FFFBEE; --glow-a: rgba(255,157,0,.22); --glow-b: rgba(134,0,221,.12);
    --surface: #ffffff; --surface-soft: #FFF7E6; --surface-strong: #FFEFD0;
    --text: #333333; --text-muted: #5E574C; --text-faint: #726A5D;
    --border: rgba(51,51,51,.12); --border-strong: rgba(51,51,51,.2);
    --accent: #FF9D00; --accent-soft: rgba(255,157,0,.14);
    --secondary: #8600DD; --secondary-strong: #6B00B3; --secondary-soft: rgba(134,0,221,.10); --secondary-border: rgba(134,0,221,.45);
    --danger: #b42318; --danger-soft: #fef3f2; --danger-border: rgba(180,35,24,.22);
    --ok: #0b7d54; --ok-soft: rgba(15,157,103,.12);
    --shadow: 0 30px 80px -30px rgba(80,50,0,.28), 0 8px 24px -16px rgba(80,50,0,.2);
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1426; --glow-a: rgba(255,184,64,.16); --glow-b: rgba(183,102,240,.2);
      --surface: #241A36; --surface-soft: #2C2042; --surface-strong: #35284f;
      --text: #f3eefb; --text-muted: #c9bfdc; --text-faint: #a99dc0;
      --border: rgba(255,255,255,.12); --border-strong: rgba(255,255,255,.22);
      --accent: #FFB840; --accent-soft: rgba(255,184,64,.16);
      --secondary: #B766F0; --secondary-strong: #D2A0FF; --secondary-soft: rgba(183,102,240,.16); --secondary-border: rgba(183,102,240,.55);
      --danger: #ff9d94; --danger-soft: rgba(180,35,24,.16); --danger-border: rgba(255,157,148,.3);
      --ok: #43d9a0; --ok-soft: rgba(67,217,160,.14);
      --shadow: 0 30px 90px -30px rgba(0,0,0,.75);
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh; padding: 24px 16px; font-family: var(--font); color: var(--text);
    background: radial-gradient(900px 600px at 8% -10%, var(--glow-a), transparent 60%), radial-gradient(800px 600px at 100% 110%, var(--glow-b), transparent 55%), var(--bg);
    -webkit-font-smoothing: antialiased; display: flex; justify-content: center; align-items: flex-start;
  }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { width: 100%; max-width: 560px; margin: auto; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; box-shadow: var(--shadow); padding: 26px 22px; }
  .logo { display: block; height: 44px; width: auto; margin: 0 auto 18px; }
  h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -.02em; text-align: center; }
  .sub { margin: 0 0 20px; text-align: center; color: var(--text-muted); font-size: 14px; }
  .banner { display: flex; gap: 10px; align-items: flex-start; padding: 11px 13px; border-radius: 13px; font-size: 13px; line-height: 1.45; margin: 0 0 16px; }
  .banner.test { background: var(--secondary-soft); border: 1px solid var(--secondary-border); color: var(--text); }
  .banner.sim { background: var(--accent-soft); border: 1px dashed var(--accent); }
  .banner b { color: var(--secondary-strong); }
  .summary { border: 1px solid var(--border); background: var(--surface-soft); border-radius: 16px; padding: 14px 16px; margin: 0 0 18px; }
  .summary dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13.5px; }
  .summary dt { color: var(--text-muted); }
  .summary dd { margin: 0; text-align: right; overflow-wrap: anywhere; font-weight: 600; }
  .total { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .total span { color: var(--text-muted); font-size: 13px; }
  .total strong { font-size: 30px; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .estado { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
  .estado.pendiente { background: rgba(255,157,0,.2); color: #8A5300; }
  .estado.aprobado { background: var(--ok-soft); color: var(--ok); }
  .estado.rechazado, .estado.fallido, .estado.anulado { background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger-border); }
  @media (prefers-color-scheme: dark) { .estado.pendiente { color: #FFB840; } }
  .pay-slot { min-height: 64px; display: flex; justify-content: center; align-items: center; margin: 6px 0 8px; }
  .tests { margin: 16px 0 0; padding: 14px 16px; border: 1px dashed var(--border-strong); border-radius: 14px; font-size: 13px; }
  .tests h2 { margin: 0 0 8px; font-size: 13px; }
  .tests table { width: 100%; border-collapse: collapse; }
  .tests td { padding: 5px 0; vertical-align: top; }
  .tests td:last-child { text-align: right; }
  .tests code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; background: var(--surface-soft); padding: 2px 6px; border-radius: 6px; }
  .tests p { margin: 8px 0 0; color: var(--text-muted); font-size: 12px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn { flex: 1 1 140px; min-height: 48px; padding: 0 18px; border-radius: 13px; border: 1px solid var(--border-strong); background: var(--surface); font-weight: 700; font-size: 14.5px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; text-align: center; }
  .btn:hover { background: var(--surface-soft); }
  .btn.primary { border: 0; background: linear-gradient(135deg, #FFB03A, #FF9D00); color: #333; box-shadow: 0 14px 26px -14px rgba(255,157,0,.8); }
  .btn.ok { border: 0; background: var(--ok); color: #fff; }
  .btn.bad { border-color: var(--danger-border); color: var(--danger); background: var(--danger-soft); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .back { margin-top: 16px; text-align: center; }
  .back a { color: var(--secondary); font-weight: 650; font-size: 14px; }
  .result { text-align: center; padding: 8px 0 4px; }
  .result .icon { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 14px; font-size: 44px; }
  .result.ok .icon { background: var(--ok-soft); color: var(--ok); animation: pop .5s cubic-bezier(.2,1.4,.4,1) both; }
  .result.bad .icon { background: var(--danger-soft); color: var(--danger); }
  .result.wait .icon { background: var(--accent-soft); }
  .result h2 { margin: 0 0 6px; font-size: 24px; letter-spacing: -.02em; }
  .result p { margin: 0 0 14px; color: var(--text-muted); font-size: 14px; }
  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 4px solid var(--surface-strong); border-top-color: var(--accent); animation: spin 1s linear infinite; }
  .error { padding: 12px 14px; border-radius: 12px; background: var(--danger-soft); border: 1px solid var(--danger-border); color: var(--danger); font-size: 13.5px; margin: 0 0 14px; }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; } }
  @media (max-width: 480px) { .card { padding: 22px 16px; } .total strong { font-size: 26px; } }
</style>
</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>
<main class="wrap">
  <div class="card" id="card" aria-live="polite">
    <img class="logo" src="assets/logo-unab.png" alt="Universidad Autónoma de Bucaramanga UNAB">
    <h1>Pago seguro</h1>
    <p class="sub">Asistente Académico UNAB</p>
    <div id="view"><div class="result wait"><div class="icon"><div class="spinner" role="status" aria-label="Cargando"></div></div><p>Cargando tu orden…</p></div></div>
  </div>
  <p class="back"><a href="/app/">&larr; Volver al chat</a></p>
</main>

<script>
(function () {
  "use strict";

  var BOLD_LIB = "https://checkout.bold.co/library/boldPaymentButton.js";
  var view = document.getElementById("view");
  var params = new URLSearchParams(location.search);
  var orderId = params.get("order") || params.get("bold-order-id") || "";
  var returning = params.has("bold-tx-status") || params.has("bold-order-id");
  var celebrated = false;

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }

  function money(v, cur) {
    try { return new Intl.NumberFormat("es-CO", { style: "currency", currency: cur || "COP", maximumFractionDigits: 0 }).format(Number(v) || 0); }
    catch (e) { return "$" + (Number(v) || 0) + " " + (cur || "COP"); }
  }

  var CONCEPTO = { matricula: "Matrícula", reserva: "Reserva de espacio", multa_biblioteca: "Multa de biblioteca" };
  var ESTADO = { pendiente: "Pendiente", aprobado: "Aprobado", rechazado: "Rechazado", fallido: "Fallido", anulado: "Anulado" };

  function api(path, opts) {
    return fetch(path, Object.assign({ cache: "no-store" }, opts || {})).then(function (r) {
      return r.text().then(function (t) {
        var data = null;
        try { data = t ? JSON.parse(t) : null; } catch (e) { data = null; }
        if (!r.ok) { var err = new Error((data && data.detail) || "Error " + r.status); err.status = r.status; throw err; }
        return data;
      });
    });
  }

  function summary(p) {
    var box = el("div", "summary");
    var dl = el("dl");
    function row(k, v) { dl.appendChild(el("dt", "", k)); var dd = el("dd"); if (v instanceof Node) dd.appendChild(v); else dd.textContent = v; dl.appendChild(dd); }
    row("Concepto", CONCEPTO[p.concepto] || p.concepto || "Pago");
    row("Descripción", p.descripcion || "—");
    row("Estudiante", p.codigoEstudiante || "—");
    row("Orden", p.orderId);
    row("Estado", el("span", "estado " + String(p.estado || "pendiente"), ESTADO[p.estado] || p.estado));
    box.appendChild(dl);
    var total = el("div", "total");
    total.appendChild(el("span", "", "Total a pagar"));
    total.appendChild(el("strong", "", money(p.monto, p.moneda)));
    box.appendChild(total);
    return box;
  }

  function backBtn(label, primary) {
    var a = el("a", "btn" + (primary ? " primary" : ""), label || "Volver al chat");
    a.href = "/app/";
    return a;
  }

  function showError(message) {
    view.replaceChildren();
    view.appendChild(el("div", "error", message));
    var row = el("div", "row");
    row.appendChild(backBtn("Volver al chat", true));
    view.appendChild(row);
  }

  /* ---------- Resultado ---------- */
  function showResult(p, extra) {
    view.replaceChildren();
    var kind = p.estado === "aprobado" ? "ok" : (p.estado === "pendiente" ? "wait" : "bad");
    var res = el("div", "result " + kind);
    var icon = el("div", "icon", kind === "ok" ? "✓" : (kind === "bad" ? "✕" : "…"));
    icon.setAttribute("aria-hidden", "true");
    res.appendChild(icon);
    if (kind === "ok") {
      res.appendChild(el("h2", "", "¡Pago aprobado!"));
      res.appendChild(el("p", "", "Recibimos tu pago de " + money(p.monto, p.moneda) + ". Ya puedes volver al chat."));
    } else if (kind === "bad") {
      res.appendChild(el("h2", "", p.estado === "rechazado" ? "Pago rechazado" : "El pago no se completó"));
      res.appendChild(el("p", "", "No se hizo ningún cobro. Puedes intentarlo de nuevo con otra tarjeta."));
    } else {
      res.appendChild(el("h2", "", "Aún no tenemos confirmación"));
      res.appendChild(el("p", "", extra || "El banco todavía está procesando el pago. Revisa de nuevo en un momento."));
    }
    view.appendChild(res);
    view.appendChild(summary(p));
    var row = el("div", "row");
    if (kind !== "ok") {
      var again = el("a", "btn", kind === "wait" ? "Revisar de nuevo" : "Intentar de nuevo");
      again.href = "pagar.html?order=" + encodeURIComponent(p.orderId);
      row.appendChild(again);
    }
    row.appendChild(backBtn("Volver al chat", true));
    view.appendChild(row);
    if (kind === "ok" && !celebrated) { celebrated = true; confetti(); }
  }

  /* ---------- Polling tras el retorno de Bold ---------- */
  function pollAfterReturn() {
    view.replaceChildren();
    var wait = el("div", "result wait");
    var icon = el("div", "icon");
    var sp = el("div", "spinner");
    sp.setAttribute("role", "status");
    sp.setAttribute("aria-label", "Confirmando el pago");
    icon.appendChild(sp);
    wait.appendChild(icon);
    wait.appendChild(el("h2", "", "Confirmando tu pago…"));
    wait.appendChild(el("p", "", "Estamos esperando la confirmación del banco. Puede tardar unos segundos."));
    view.appendChild(wait);

    var started = Date.now();
    var last = null;
    function tick() {
      api("/api/pagos/" + encodeURIComponent(orderId)).then(function (p) {
        last = p;
        if (p.estado !== "pendiente") { showResult(p); return; }
        next();
      }).catch(function () { next(); });
    }
    function next() {
      if (Date.now() - started >= 60000) {
        if (last) showResult(last, "Pasaron 60 segundos sin confirmación. Revisa de nuevo en un momento.");
        else showError("No pudimos consultar el estado del pago. Revisa de nuevo en un momento.");
        return;
      }
      window.setTimeout(tick, 3000);
    }
    tick();
  }

  /* ---------- Bold ---------- */
  function loadBold() {
    return new Promise(function (resolve, reject) {
      if (window.__boldLoaded) { resolve(); return; }
      var s = document.createElement("script");
      s.src = BOLD_LIB;
      s.async = true;
      s.onload = function () { window.__boldLoaded = true; resolve(); };
      s.onerror = function () { reject(new Error("bold")); };
      document.head.appendChild(s);
    });
  }

  function injectBoldButton(slot, b) {
    var s = document.createElement("script");
    s.setAttribute("data-bold-button", "dark-L");
    s.setAttribute("data-api-key", b.apiKey);
    s.setAttribute("data-amount", String(b.amount));
    s.setAttribute("data-currency", b.currency || "COP");
    s.setAttribute("data-order-id", b.orderId);
    s.setAttribute("data-integrity-signature", b.integritySignature);
    s.setAttribute("data-description", String(b.description || "Pago UNAB").slice(0, 100));
    s.setAttribute("data-redirection-url", b.redirectionUrl);
    s.setAttribute("data-render-mode", "embedded");
    /* La librería de Bold lee los data-* de su propio <script>: debe llevar el src. */
    s.src = BOLD_LIB;
    s.async = true;
    s.onerror = function () {
      slot.replaceChildren();
      slot.appendChild(el("div", "error", "No se pudo cargar la pasarela de Bold. Revisa tu conexión y recarga la página."));
    };
    slot.appendChild(s);
  }

  function testCards() {
    var box = el("section", "tests");
    box.appendChild(el("h2", "", "Tarjetas de prueba"));
    var t = el("table");
    [["Aprueba", "4111 1111 1111 1111"], ["Rechaza", "4970 1100 0000 0062"]].forEach(function (r) {
      var tr = el("tr");
      tr.appendChild(el("td", "", r[0]));
      var td = el("td"); td.appendChild(el("code", "", r[1])); tr.appendChild(td);
      t.appendChild(tr);
    });
    box.appendChild(t);
    box.appendChild(el("p", "", "Usa cualquier fecha futura y cualquier CVV. Datos y cobros de demostración."));
    return box;
  }

  function showBold(p) {
    view.replaceChildren();
    var banner = el("div", "banner test");
    var bt = el("div");
    bt.appendChild(el("b", "", "Modo de pruebas. "));
    bt.appendChild(document.createTextNode("Este pago no genera ningún cobro real."));
    banner.appendChild(bt);
    view.appendChild(banner);
    view.appendChild(summary(p));
    var slot = el("div", "pay-slot");
    slot.appendChild(el("span", "sub", "Cargando el botón de pago…"));
    view.appendChild(slot);
    view.appendChild(testCards());

    slot.replaceChildren();
    injectBoldButton(slot, p.bold);
  }

  /* ---------- Simulado ---------- */
  function showSimulado(p) {
    view.replaceChildren();
    var banner = el("div", "banner sim");
    var bt = el("div");
    bt.appendChild(el("b", "", "Pasarela simulada (modo demo). "));
    bt.appendChild(document.createTextNode("No se conecta con ningún banco ni cobra dinero: elige el resultado que quieres ver."));
    banner.appendChild(bt);
    view.appendChild(banner);
    view.appendChild(summary(p));
    var errBox = el("div");
    view.appendChild(errBox);
    var row = el("div", "row");
    var ok = el("button", "btn ok", "Aprobar pago");
    var no = el("button", "btn bad", "Rechazar pago");
    ok.type = no.type = "button";
    function go(resultado) {
      ok.disabled = no.disabled = true;
      errBox.replaceChildren();
      api("/api/pagos/" + encodeURIComponent(p.orderId) + "/simular", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ resultado: resultado })
      }).then(function (np) {
        showResult(np && np.estado ? np : Object.assign({}, p, { estado: resultado }));
      }).catch(function (e) {
        ok.disabled = no.disabled = false;
        errBox.appendChild(el("div", "error", "No se pudo simular el pago: " + e.message));
      });
    }
    ok.addEventListener("click", function () { go("aprobado"); });
    no.addEventListener("click", function () { go("rechazado"); });
    row.appendChild(ok);
    row.appendChild(no);
    view.appendChild(row);
  }

  /* ---------- Confeti sin librerías ---------- */
  function confetti() {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var canvas = document.getElementById("confetti");
    var ctx = canvas.getContext("2d");
    var dpr = window.devicePixelRatio || 1;
    function size() { canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr; }
    size();
    var colors = ["#FF9D00", "#8600DD", "#FFB840", "#B766F0", "#0f9d67", "#ffffff"];
    var parts = [];
    for (var i = 0; i < 160; i++) {
      parts.push({
        x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .4,
        vx: (Math.random() - .5) * 16, vy: -Math.random() * 15 - 4,
        w: 6 + Math.random() * 7, h: 4 + Math.random() * 6,
        rot: Math.random() * 6, vr: (Math.random() - .5) * .4,
        color: colors[i % colors.length]
      });
    }
    var start = performance.now();
    function frame(now) {
      var t = now - start;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      parts.forEach(function (p) {
        p.vy += .35; p.vx *= .992; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        ctx.save();
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.globalAlpha = Math.max(0, 1 - t / 4200);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      if (t < 4200) requestAnimationFrame(frame);
      else ctx.clearRect(0, 0, innerWidth, innerHeight);
    }
    requestAnimationFrame(frame);
  }

  /* ---------- Arranque ---------- */
  if (!/^[A-Za-z0-9_-]{1,80}$/.test(orderId)) {
    showError("No encontramos la orden de pago. Vuelve al chat y genera el pago de nuevo.");
    return;
  }

  api("/api/pagos/" + encodeURIComponent(orderId)).then(function (p) {
    if (!p || !p.orderId) throw new Error("Orden inválida");
    if (returning) { pollAfterReturn(); return; }
    if (p.estado !== "pendiente") { showResult(p); return; }
    if (p.bold && p.bold.apiKey) showBold(p);
    else if (p.simulado) showSimulado(p);
    else {
      view.replaceChildren();
      view.appendChild(summary(p));
      view.appendChild(el("div", "error", "La pasarela de pagos no está disponible en este momento."));
      var row = el("div", "row"); row.appendChild(backBtn("Volver al chat", true)); view.appendChild(row);
    }
  }).catch(function (e) {
    showError(e && e.status === 404 ? "No encontramos esa orden de pago." : "No pudimos cargar la orden de pago. " + (e && e.message ? e.message : ""));
  });
})();
</script>
</body>
</html>
